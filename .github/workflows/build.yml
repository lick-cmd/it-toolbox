name: build

# 技术设计 §6.3 承诺的四平台矩阵：macOS(arm64/x64) + Windows(x64/arm64)。
# 签名：macOS 侧已落地 ad-hoc 签名（tauri.conf.json 的 bundle.macOS.signingIdentity = "-"），
# 签名结构自洽、Gatekeeper 判「未验证的开发者」，可点「仍要打开」放行；不公证（本仓库无 Apple 证书）。
# Windows 侧无签名，走 SmartScreen 的「仍要运行」。详见验证报告 §9.7 与 README「macOS 首次启动」。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支的旧跑批自动取消，避免排队积压
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁（lint / typecheck / test / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 仓库根目录带 .npmrc（legacy-peer-deps），npm ci 会读取它
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 含 scripts/scan-egress.mjs 的产物外发扫描 —— 离线承诺的第 3 层
      - run: npm run build

  bundle:
    name: 打包 ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            artifact: dmg-macos-arm64
          # macos-13（Intel）镜像已于 2025-12-04 退役，该标签不再有机器可分配：
          # job 会一直停在 queued、永不结束，并把下游 release 一起卡死（needs: bundle 要四腿全绿）。
          # 现改用官方 Intel 标签 macos-15-intel —— 原生 x64 机器，无需交叉编译。
          - label: macOS x64
            os: macos-15-intel
            artifact: dmg-macos-x64
          - label: Windows x64
            os: windows-latest
            artifact: nsis-windows-x64
          # windows-11-arm 是 GitHub 的公开预览标签；若该 runner 不可用，
          # 这一条即整矩阵唯一需要调整的地方（去掉它不影响其余三平台）
          - label: Windows arm64
            os: windows-11-arm
            artifact: nsis-windows-arm64

    runs-on: ${{ matrix.os }}
    # 兜底：单 job 默认超时 6 小时，runner 不可用时会把跑批静默拖住半天；
    # 压到 60 分钟让它明确失败，而不是连带 release job 一起无限等待。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 签名：macOS 的 ad-hoc 签名已在 tauri.conf.json 落地（signingIdentity = "-"）。
      # 2026-09-16 实测两架构产物 codesign --verify 均为 0、spctl 判干净 rejected
      # （修复前 arm64 缺 _CodeSignature、会落进「已损坏」类别）—— 详见验证报告 §9.7。
      # 公证仍只预留配置位（环境变量注入），未注入时不做公证。
      # 非本平台的 bundle 目标会被跳过（本机实测：config 的 targets 含 nsis，macOS 上只出 dmg 且不报错）；
      # 万一某个 runner 报「不支持的目标」，用 `--bundles dmg` / `--bundles nsis` 显式覆盖即可。
      - run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 两个路径各自只在对应平台存在，命中其一即可
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # 发布：只在 tag（v*）上跑，把四个平台的产物挂进 Release。
  # 草稿形态（draft: true）—— 资产先挂上，人确认无误后再点 Publish。
  # 注意：新建仓库的 GITHUB_TOKEN 默认只读，必须显式声明 contents: write，否则创建 Release 会 403。
  release:
    name: 发布 Release 草稿
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # 上传前把清单打进日志，便于核对「四个包是否都到了」
      - name: 核对待上传资产
        run: ls -lh release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IT Toolbox ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
